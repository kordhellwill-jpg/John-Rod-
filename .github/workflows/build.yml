              public static final DeferredRegister<Action<?>> ACTIONS = DeferredRegister.create(
                      (Class<Action<?>>) ((Class<?>) Action.class), AddonMain.MOD_ID);
              @SuppressWarnings("unchecked")
              public static final DeferredRegister<StandType<?>> STANDS = DeferredRegister.create(
                      (Class<StandType<?>>) ((Class<?>) StandType.class), AddonMain.MOD_ID);

              // ======================================== John Rod ========================================

              public static final RegistryObject<StandEntityAction> JOHN_ROD_PUNCH = ACTIONS.register("john_rod_punch",
                      () -> new StandEntityLightAttack(new StandEntityLightAttack.Builder()
                              .punchSound(ModSounds.STAND_PUNCH_LIGHT)));

              public static final RegistryObject<StandEntityAction> JOHN_ROD_BARRAGE = ACTIONS.register("john_rod_barrage",
                      () -> new StandEntityMeleeBarrage(new StandEntityMeleeBarrage.Builder()
                              .barrageHitSound(ModSounds.STAND_PUNCH_LIGHT)));

              public static final RegistryObject<StandEntityAction> JOHN_ROD_BLOCK = ACTIONS.register("john_rod_block",
                      () -> new StandEntityBlock());

              // lock onto a target
              public static final RegistryObject<StandEntityAction> JOHN_ROD_MARK = ACTIONS.register("john_rod_mark",
                      () -> new JohnRodAbility(new StandEntityAction.Builder()
                              .staminaCost(10.0F)
                              .cooldown(20)
                              .standUserWalkSpeed(1.0F), JohnRodAbility.Mode.MARK));

              // the rods of light fall from the sky onto the marked target
              public static final RegistryObject<StandEntityAction> JOHN_ROD_HUNT = ACTIONS.register("john_rod_hunt",
                      () -> new JohnRodAbility(new StandEntityAction.Builder()
                              .staminaCost(100.0F)
                              .cooldown(300)
                              .standUserWalkSpeed(1.0F), JohnRodAbility.Mode.HUNT));

              // touch the target in front of you
              public static final RegistryObject<StandEntityAction> JOHN_ROD_TOUCH = ACTIONS.register("john_rod_touch",
                      () -> new JohnRodAbility(new StandEntityAction.Builder()
                              .staminaCost(60.0F)
                              .cooldown(200)
                              .standUserWalkSpeed(1.0F)
                              .partsRequired(StandPart.MAIN_BODY), JohnRodAbility.Mode.TOUCH));

              public static final EntityStandRegistryObject<EntityStandType<StandStats>, StandEntityType<JohnRodEntity>> STAND_JOHN_ROD =
                      new EntityStandRegistryObject<>("john_rod",
                              STANDS,
                              () -> new EntityStandType.Builder<StandStats>()
                              .color(0xE8F6FF)
                              .storyPartName(ModStandsInit.PART_3_NAME)
                              .leftClickHotbar(
                                      JOHN_ROD_PUNCH.get(),
                                      JOHN_ROD_BARRAGE.get()
                                      )
                              .rightClickHotbar(
                                      JOHN_ROD_BLOCK.get(),
                                      JOHN_ROD_MARK.get(),
                                      JOHN_ROD_HUNT.get(),
                                      JOHN_ROD_TOUCH.get()
                                      )
                              .defaultStats(StandStats.class, new StandStats.Builder()
                                      .tier(6)
                                      .power(20)
                                      .speed(20)
                                      .range(100, 300)
                                      .durability(15)
                                      .precision(15)
                                      .build())
                              .build(),

                              InitEntities.ENTITIES,
                              () -> new StandEntityType<JohnRodEntity>(JohnRodEntity::new, 0.6F, 2.4F)
                              .summonSound(ModSounds.STAND_SUMMON_DEFAULT)
                              .unsummonSound(ModSounds.STAND_UNSUMMON_DEFAULT))
                      .withDefaultStandAttributes();
          }
